<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Lecture &amp; Attendance Exception Automated Verification Suite</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc; }
    h1 { color: #60a5fa; font-size: 20px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    #root-test-mount { background: #ffffff; color: #000; padding: 20px; margin-top: 20px; border-radius: 8px; display: none; }
  </style>

  <!-- Local vendor libs -->
  <script src="/libs/react.min.js"></script>
  <script src="/libs/react-dom.min.js"></script>
  <script src="/libs/lucide.min.js"></script>
  <script src="/libs/xlsx.min.js"></script>
  <script src="/libs/pdf.min.js"></script>
  <script src="/libs/tesseract.min.js"></script>

  <script>
    // Save native globals BEFORE Lucide setup
    var _nat = {};
    ['Map','Set','WeakMap','WeakSet','Promise','Symbol','Error','Image','URL',
     'Event','Request','Response','Headers','Date','RegExp','Number','String',
     'Boolean','Function','Array','Object','History','Location','Screen',
     'MutationObserver','IntersectionObserver','ResizeObserver'
    ].forEach(function(n) { if (window[n]) _nat[n] = window[n]; });

    window.LucideIcons = {};
    if (window.lucide && window.lucide.icons) {
      Object.keys(window.lucide.icons).forEach(iconName => {
        const pascalName = iconName.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
        const IconComponent = (props) => {
          const { size = 24, color = 'currentColor', strokeWidth = 2, className = '', style = {}, ...rest } = props;
          const svgContent = window.lucide.icons[iconName];
          if (!svgContent) return null;
          const renderNode = (node, key) => {
            const [tag, attrs = {}, children = []] = node;
            const reactAttrs = { key };
            Object.keys(attrs).forEach(k => { reactAttrs[k === 'class' ? 'className' : k] = attrs[k]; });
            return React.createElement(tag, reactAttrs, (children || []).map((c, i) => renderNode(c, i)));
          };
          return React.createElement('svg', {
            xmlns: 'http://www.w3.org/2000/svg', width: size, height: size,
            viewBox: '0 0 24 24', fill: 'none', stroke: color,
            strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round',
            className, style: { display: 'inline-block', verticalAlign: 'middle', ...style }, ...rest
          }, (svgContent[2] || []).map((c, i) => renderNode(c, i)));
        };
        window[pascalName] = IconComponent;
        window.LucideIcons[pascalName] = IconComponent;
      });
    }

    Object.keys(_nat).forEach(function(n) { window[n] = _nat[n]; });

    window.CalendarIcon = window.LucideIcons.Calendar;
    window.SettingsIcon = window.LucideIcons.Settings;
    window.ImageIcon    = window.LucideIcons.Image;
    window.MapIcon      = window.LucideIcons.Map;

    window.useState      = React.useState;
    window.useEffect     = React.useEffect;
    window.useMemo       = React.useMemo;
    window.useRef        = React.useRef;
    window.useCallback   = React.useCallback;
    window.createContext = React.createContext;
    window.useContext    = React.useContext;
    window.useReducer    = React.useReducer;
    window.useLayoutEffect = React.useLayoutEffect;
  </script>

  <!-- Pre-compiled application bundle -->
  <script src="/app-bundle.js"></script>
</head>
<body>
  <h1>ADIT Campus Attendance - Multi-Lecture &amp; Exception Test Suite</h1>
  <div id="output"></div>
  <div id="root-test-mount"></div>

  <script>
    const outputEl = document.getElementById('output');
    const results = [];

    function log(message, pass = true) {
      const div = document.createElement('div');
      div.className = pass ? 'pass' : 'fail';
      div.innerText = (pass ? '✓ PASS: ' : '✗ FAIL: ') + message;
      outputEl.appendChild(div);
      results.push({ text: div.innerText, pass });
    }

    function assert(cond, msg) {
      if (!cond) {
        log(msg, false);
        throw new Error(msg);
      } else {
        log(msg, true);
      }
    }

    async function runTestSuite() {
      try {
        log("Starting Comprehensive 10-Scenario Test Suite Execution...", true);

        // Clear and initialize clean storage
        localStorage.clear();
        if (window.initializeStorage) window.initializeStorage();

        const facultyUser = {
          id: 'FAC_PS',
          facultyId: 'FAC_PS',
          name: 'Prof. Priya Shah',
          role: 'faculty',
          dept: 'AI & Data Science',
          deptId: 'DEP_AI'
        };

        const adminUser = {
          id: 'ADMIN_01',
          name: 'Administrator',
          role: 'admin',
          dept: 'Administration'
        };

        // =========================================================================
        // SCENARIO 1: Lecture A attendance saves and displays correctly in register
        // =========================================================================
        log("=== SCENARIO 1: Saving Lecture A Attendance ===");
        const dateLec = '2026-10-25';
        const sessionA = {
          date: dateLec,
          startTime: '09:00',
          endTime: '09:55',
          timeSlot: '09:00 - 09:55',
          subjectId: 'SUB_AI_DS',
          subjectName: 'Data Structures',
          facultyId: facultyUser.id,
          facultyName: facultyUser.name,
          department: 'AI & Data Science',
          sem: '3rd Sem',
          division: 'Div 1',
          batch: 'ALL',
          topic: 'Array Operations & Traversal',
          records: {
            'S_AI_01': 'present',
            'S_AI_02': 'absent',
            'S_AI_03': 'present',
            '24AD001': 'present',
            '24AD002': 'absent',
            '24AD003': 'present'
          },
          totalStudents: 3,
          presentCount: 2,
          absentCount: 1,
          submittedAt: new Date().toISOString()
        };

        const resSaveA = window.saveSession(sessionA, facultyUser);
        const savedIdA = resSaveA.id || resSaveA.saved?.id || (resSaveA.find(s => s.date === dateLec && s.timeSlot === '09:00 - 09:55')?.id);
        assert(savedIdA, "TEST 1.1: Lecture A saved successfully and received unique session ID");

        const allSessionsAfterA = window.getSessions({}, facultyUser);
        const fetchedA = allSessionsAfterA.find(s => s.id === savedIdA);
        assert(fetchedA !== undefined, "TEST 1.2: Lecture A retrieved from database");
        assert(fetchedA.date === dateLec, "TEST 1.3: Lecture A date matches saved date");
        assert(fetchedA.timeSlot === '09:00 - 09:55', "TEST 1.4: Lecture A timeSlot matches 09:00 - 09:55");
        assert(fetchedA.records['S_AI_01'] === 'present', "TEST 1.5: Student 1 marked present in Lecture A");
        assert(fetchedA.records['S_AI_02'] === 'absent', "TEST 1.6: Student 2 marked absent in Lecture A");

        // =========================================================================
        // SCENARIO 2: Lecture B saved on same day displays independently; A unchanged
        // =========================================================================
        log("=== SCENARIO 2: Saving Lecture B on Same Day independently ===");
        const sessionB = {
          date: dateLec,
          startTime: '09:55',
          endTime: '10:50',
          timeSlot: '09:55 - 10:50',
          subjectId: 'SUB_AI_DS',
          subjectName: 'Data Structures',
          facultyId: facultyUser.id,
          facultyName: facultyUser.name,
          department: 'AI & Data Science',
          sem: '3rd Sem',
          division: 'Div 1',
          batch: 'ALL',
          topic: 'Linked List Pointers',
          records: {
            'S_AI_01': 'absent',
            'S_AI_02': 'present',
            'S_AI_03': 'present',
            '24AD001': 'absent',
            '24AD002': 'present',
            '24AD003': 'present'
          },
          totalStudents: 3,
          presentCount: 2,
          absentCount: 1,
          submittedAt: new Date().toISOString()
        };

        const resSaveB = window.saveSession(sessionB, facultyUser);
        const savedIdB = resSaveB.id || resSaveB.saved?.id || (resSaveB.find(s => s.date === dateLec && s.timeSlot === '09:55 - 10:50')?.id);
        assert(savedIdB, "TEST 2.1: Lecture B saved successfully and received unique session ID");
        assert(savedIdA !== savedIdB, "TEST 2.2: Lecture A and Lecture B have distinct unique IDs");

        const allSessionsAfterB = window.getSessions({}, facultyUser);
        const checkA = allSessionsAfterB.find(s => s.id === savedIdA);
        const checkB = allSessionsAfterB.find(s => s.id === savedIdB);

        assert(checkA !== undefined, "TEST 2.3: Lecture A still exists after saving Lecture B");
        assert(checkB !== undefined, "TEST 2.4: Lecture B exists in session register");

        // Verify Lecture A remains 100% UNCHANGED
        assert(checkA.records['S_AI_01'] === 'present', "TEST 2.5: Lecture A record for Student 1 remained present");
        assert(checkA.records['S_AI_02'] === 'absent', "TEST 2.6: Lecture A record for Student 2 remained absent");
        assert(checkA.timeSlot === '09:00 - 09:55', "TEST 2.7: Lecture A timeSlot intact");

        // Verify Lecture B has its OWN independent records
        assert(checkB.records['S_AI_01'] === 'absent', "TEST 2.8: Lecture B record for Student 1 is absent");
        assert(checkB.records['S_AI_02'] === 'present', "TEST 2.9: Lecture B record for Student 2 is present");
        assert(checkB.timeSlot === '09:55 - 10:50', "TEST 2.10: Lecture B timeSlot intact");

        // =========================================================================
        // SCENARIO 3: Reopening both lectures retains their original records
        // =========================================================================
        log("=== SCENARIO 3: Reopening and Modifying Lecture B without affecting Lecture A ===");
        // Update lecture B topic & student 3 status
        const updatedB = {
          ...checkB,
          topic: 'Linked List Pointers & Memory Alloc',
          records: {
            ...checkB.records,
            'S_AI_03': 'absent',
            '24AD003': 'absent'
          }
        };
        window.saveSession(updatedB, facultyUser);

        const reloadedA = window.getSessions({}, facultyUser).find(s => s.id === savedIdA);
        const reloadedB = window.getSessions({}, facultyUser).find(s => s.id === savedIdB);

        assert(reloadedA.records['S_AI_03'] === 'present', "TEST 3.1: Lecture A Student 3 is STILL present");
        assert(reloadedB.records['S_AI_03'] === 'absent', "TEST 3.2: Lecture B Student 3 successfully updated to absent");
        assert(reloadedB.topic === 'Linked List Pointers & Memory Alloc', "TEST 3.3: Lecture B topic updated independently");

        // =========================================================================
        // SCENARIO 4: Page refresh preserves both lectures correctly
        // =========================================================================
        log("=== SCENARIO 4: Storage Persistence and Re-initialization ===");
        // Verify raw localStorage contains both
        const rawJson = localStorage.getItem('adit_attendance_sessions');
        assert(rawJson && rawJson.length > 0, "TEST 4.1: Sessions present in localStorage");
        const parsed = JSON.parse(rawJson);
        const pA = parsed.find(s => s.id === savedIdA);
        const pB = parsed.find(s => s.id === savedIdB);
        assert(pA && pB, "TEST 4.2: Both sessions persist in localStorage");
        assert(pA.timeSlot === '09:00 - 09:55' && pB.timeSlot === '09:55 - 10:50', "TEST 4.3: Persisted timeSlots accurate");

        // Simulate new page load with initializeStorage()
        window.initializeStorage();
        const freshSessions = window.getSessions({}, facultyUser);
        const freshA = freshSessions.find(s => s.id === savedIdA);
        const freshB = freshSessions.find(s => s.id === savedIdB);
        assert(freshA && freshB, "TEST 4.4: Both lectures retained after initializeStorage");

        // =========================================================================
        // SCENARIO 5: Different subject / division records do not mix
        // =========================================================================
        log("=== SCENARIO 5: Cross-Subject and Cross-Division Isolation ===");
        const sessionDiv2 = {
          date: dateLec,
          startTime: '09:00',
          endTime: '09:55',
          timeSlot: '09:00 - 09:55',
          subjectId: 'SUB_AI_DS',
          subjectName: 'Data Structures',
          facultyId: 'FAC_OTHER',
          facultyName: 'Prof. Other',
          department: 'AI & Data Science',
          sem: '3rd Sem',
          division: 'Div 2',
          batch: 'ALL',
          topic: 'Div 2 Introduction',
          records: {
            'S_AI_04': 'present'
          },
          totalStudents: 1,
          presentCount: 1,
          absentCount: 0
        };
        const resDiv2 = window.saveSession(sessionDiv2, adminUser);
        const savedIdDiv2 = resDiv2.id || resDiv2.saved?.id || (resDiv2.find(s => s.division === 'Div 2')?.id);
        assert(savedIdDiv2, "TEST 5.1: Div 2 lecture saved");

        // Filter sessions by Div 1
        const div1Sessions = window.getSessions({ division: 'Div 1' }, adminUser);
        assert(div1Sessions.every(s => s.division === 'Div 1'), "TEST 5.2: Div 1 filter strictly isolates Div 1 sessions");
        assert(!div1Sessions.some(s => s.id === savedIdDiv2), "TEST 5.3: Div 2 session never leaks into Div 1 filter");

        // =========================================================================
        // SCENARIO 6: Exception form without student selection creates no exception
        // =========================================================================
        log("=== SCENARIO 6: Guarding Exception Creation without Student Selection ===");
        const initExceptionsCount = window.getExceptions().length;
        const invalidExc = window.saveException({
          studentId: '',
          activityName: 'Hackathon',
          startDate: '2026-10-25',
          endDate: '2026-10-25'
        }, facultyUser);

        assert(invalidExc.success === false, "TEST 6.1: Exception without student is rejected by saveException");
        const afterInvalidCount = window.getExceptions().length;
        assert(afterInvalidCount === initExceptionsCount, "TEST 6.2: No exception record created when student missing");

        // =========================================================================
        // SCENARIO 7: Selecting one student for an exception affects ONLY that student
        // =========================================================================
        log("=== SCENARIO 7: Single-Student Exception Isolation ===");
        const validExc = window.saveException({
          studentId: 'S_AI_01',
          studentName: 'Aarav Patel',
          enrollmentNo: '24AD001',
          departmentId: 'AI & Data Science',
          semester: '3rd Sem',
          division: 'Div 1',
          activityName: 'National Robotics Championship',
          category: 'Hackathon / Tech Fest',
          startDate: '2026-10-28',
          endDate: '2026-10-29',
          reason: 'Representing ADIT at National Level',
          submittedBy: facultyUser.name,
          submittedByRole: 'faculty'
        }, facultyUser);

        assert(validExc.success === true, "TEST 7.1: Approved exception created for Student 1 (24AD001)");

        // Test exception check on the covered date 2026-10-28
        const checkSt1 = window.isStudentExcusedForSession('S_AI_01', '2026-10-28', '09:00 - 09:55', 'SUB_AI_DS');
        const checkSt2 = window.isStudentExcusedForSession('S_AI_02', '2026-10-28', '09:00 - 09:55', 'SUB_AI_DS');
        const checkSt3 = window.isStudentExcusedForSession('S_AI_03', '2026-10-28', '09:00 - 09:55', 'SUB_AI_DS');

        assert(checkSt1.isExcused === true, "TEST 7.2: Student 1 IS excused for session on 2026-10-28");
        assert(checkSt2.isExcused === false, "TEST 7.3: Student 2 is NOT excused (strictly unaffected)");
        assert(checkSt3.isExcused === false, "TEST 7.4: Student 3 is NOT excused (strictly unaffected)");

        // Test date boundary: session on 2026-10-30 (after end date)
        const checkSt1After = window.isStudentExcusedForSession('S_AI_01', '2026-10-30', '09:00 - 09:55', 'SUB_AI_DS');
        assert(checkSt1After.isExcused === false, "TEST 7.5: Student 1 exception does NOT apply to dates outside date range");

        // =========================================================================
        // SCENARIO 8: Ordinary attendance for student without approved exception never marks EX
        // =========================================================================
        log("=== SCENARIO 8: Student 2 (Student B) Ordinary Attendance Never Marked EX ===");
        // Student 2 (S_AI_02 / 24AD002) has NO approved exception.
        const excCheckSt2 = window.isStudentExcusedForSession('S_AI_02', '2026-10-25', '09:00 - 09:55', 'SUB_AI_DS');
        assert(excCheckSt2.isExcused === false, "TEST 8.1: Student 2 has no approved exception for 2026-10-25");

        // When marked absent in Lecture A, Student 2 must be 'absent' and NEVER 'od' or 'EX'
        const sessACheck = window.getSessions({}, facultyUser).find(s => s.id === savedIdA);
        assert(sessACheck.records['S_AI_02'] === 'absent', "TEST 8.2: Student 2 recorded status is strictly 'absent'");
        assert(sessACheck.records['S_AI_02'] !== 'od', "TEST 8.3: Student 2 is NOT 'od'");
        assert(sessACheck.records['S_AI_02'] !== 'exception', "TEST 8.4: Student 2 is NOT 'exception'");

        // When marked present in Lecture B, Student 2 is 'present'
        const sessBCheck = window.getSessions({}, facultyUser).find(s => s.id === savedIdB);
        assert(sessBCheck.records['S_AI_02'] === 'present', "TEST 8.5: Student 2 recorded status in Lecture B is 'present'");

        // =========================================================================
        // SCENARIO 9: Approved exceptions follow institutional attendance policy
        // =========================================================================
        log("=== SCENARIO 9: Policy-based Exception Calculation Verification ===");
        // Create 4 sessions for testing policy:
        // Session 1: Present
        // Session 2: Present
        // Session 3: Excused Absence (od)
        // Session 4: Unexcused Absent (absent)
        const mockTestSessions = [
          { id: 'S1', date: '2026-10-01', subjectId: 'SUB_AI_DS', records: { 'S_AI_01': 'present' }, myStatus: 'present' },
          { id: 'S2', date: '2026-10-02', subjectId: 'SUB_AI_DS', records: { 'S_AI_01': 'present' }, myStatus: 'present' },
          { id: 'S3', date: '2026-10-03', subjectId: 'SUB_AI_DS', records: { 'S_AI_01': 'od' }, myStatus: 'od', isExcused: true },
          { id: 'S4', date: '2026-10-04', subjectId: 'SUB_AI_DS', records: { 'S_AI_01': 'absent' }, myStatus: 'absent' }
        ];

        // 1. Policy: COUNT_ELIGIBLE -> (2 Present + 1 Exception) / 4 = 75.0%
        const statsEligible = window.calculateStudentAttendanceStats('S_AI_01', mockTestSessions, 'COUNT_ELIGIBLE');
        log("statsEligible details: " + JSON.stringify(statsEligible));
        assert(statsEligible.totalConducted === 4, "TEST 9.1: Total conducted is 4");
        assert(statsEligible.regularPresent === 2, "TEST 9.2: Regular present is 2");
        assert(statsEligible.approvedExceptions === 1, "TEST 9.3: Approved exceptions is 1");
        assert(statsEligible.regularAbsent === 1, "TEST 9.4: Regular absent is 1");
        assert(statsEligible.percentage === 75, "TEST 9.5: COUNT_ELIGIBLE percentage is 75% ((2+1)/4*100)");

        // 2. Policy: EXCLUDE_EXCEPTION -> 2 Present / (4 Total - 1 Exception) = 2/3 = 66.7%
        const statsExclude = window.calculateStudentAttendanceStats('S_AI_01', mockTestSessions, 'EXCLUDE_EXCEPTION');
        log("statsExclude details: " + JSON.stringify(statsExclude));
        assert(Math.abs(statsExclude.percentage - 66.7) < 0.2, "TEST 9.6: EXCLUDE_EXCEPTION percentage is 66.7% (2/(4-1)*100)");

        // 3. Policy: SEPARATE_ONLY (Strict physical present only) -> 2 Present / 4 Total = 50.0%
        const statsStrict = window.calculateStudentAttendanceStats('S_AI_01', mockTestSessions, 'SEPARATE_ONLY');
        assert(statsStrict.percentage === 50, "TEST 9.7: SEPARATE_ONLY percentage is 50% (2/4*100)");

        // 4. Physical presence overrides exception:
        // Even if student has exception on a date, if marked 'present', it counts as regularPresent
        const mockOverrideSessions = [
          { id: 'S5', date: '2026-10-28', subjectId: 'SUB_AI_DS', records: { 'S_AI_01': 'present' }, myStatus: 'present', isExcused: true }
        ];
        const statsPresenceOverride = window.calculateStudentAttendanceStats('S_AI_01', mockOverrideSessions, 'COUNT_ELIGIBLE');
        assert(statsPresenceOverride.regularPresent === 1, "TEST 9.8: Explicit physical present is counted in regularPresent");
        assert(statsPresenceOverride.approvedExceptions === 0, "TEST 9.9: Present is not double-counted as exception");

        // =========================================================================
        // SCENARIO 10: Faculty attendance register and student panel show consistent data
        // =========================================================================
        log("=== SCENARIO 10: Faculty Register and Student Panel Consistency ===");
        const studentUser1 = {
          id: 'S_AI_01',
          studentId: 'S_AI_01',
          enrollmentNo: '24AD001',
          name: 'Aarav Patel',
          role: 'student',
          dept: 'AI & Data Science',
          sem: '3rd Sem',
          class: 'Div 1',
          batch: 'Batch A'
        };

        // Fetch subject attendance details as seen by student
        const studentDetails = window.getSubjectAttendanceDetails('SUB_AI_DS', studentUser1);
        assert(studentDetails !== null, "TEST 10.1: Student panel fetches subject details");
        assert(studentDetails.sessions.length >= 2, "TEST 10.2: Both Lecture A and Lecture B appear in student panel");

        // Verify Lecture A in student panel
        const stSessA = studentDetails.sessions.find(s => s.id === savedIdA);
        const stSessB = studentDetails.sessions.find(s => s.id === savedIdB);

        assert(stSessA !== undefined, "TEST 10.3: Lecture A present in student panel");
        assert(stSessA.status === 'Present', "TEST 10.4: Student 1 status for Lecture A in student panel is 'Present'");
        assert(stSessA.timeSlot === '09:00 - 09:55', "TEST 10.5: Lecture A timeSlot matches faculty register");

        assert(stSessB !== undefined, "TEST 10.6: Lecture B present in student panel");
        assert(stSessB.status === 'Absent', "TEST 10.7: Student 1 status for Lecture B in student panel is 'Absent'");
        assert(stSessB.timeSlot === '09:55 - 10:50', "TEST 10.8: Lecture B timeSlot matches faculty register");

        // Check Student 2 as well
        const studentUser2 = {
          id: 'S_AI_02',
          studentId: 'S_AI_02',
          enrollmentNo: '24AD002',
          name: 'Student B',
          role: 'student',
          dept: 'AI & Data Science',
          sem: '3rd Sem',
          class: 'Div 1',
          batch: 'Batch A'
        };
        const studentDetails2 = window.getSubjectAttendanceDetails('SUB_AI_DS', studentUser2);
        assert(studentDetails2 !== null, "TEST 10.9: Student 2 panel fetches subject details");
        const st2SessA = studentDetails2.sessions.find(s => s.id === savedIdA);
        const st2SessB = studentDetails2.sessions.find(s => s.id === savedIdB);

        assert(st2SessA.status === 'Absent', "TEST 10.10: Student 2 status for Lecture A is 'Absent' (NOT EX)");
        assert(st2SessB.status === 'Present', "TEST 10.11: Student 2 status for Lecture B is 'Present' (NOT EX)");

        log("============================================================================");
        log("ALL 10 SCENARIOS AND 43 DETAILED ASSERTIONS PASSED WITH ZERO REGRESSIONS!");
        log("============================================================================");

        // Post results to python runner
        fetch('/api/test-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            allPassed: results.every(r => r.pass),
            total: results.length,
            passed: results.filter(r => r.pass).length,
            failed: results.filter(r => !r.pass).length,
            results: results
          })
        }).catch(err => console.log('Could not post test results:', err));

      } catch (err) {
        log("UNHANDLED ERROR: " + err.message, false);
        fetch('/api/test-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            allPassed: false,
            error: err.message,
            results: results
          })
        }).catch(e => {});
      }
    }

    window.addEventListener('load', () => {
      setTimeout(runTestSuite, 400);
    });
  </script>
</body>
</html>
